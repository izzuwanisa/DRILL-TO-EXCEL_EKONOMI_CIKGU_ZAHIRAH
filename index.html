const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let st={n:"",k:"",a:Array(40).fill(-1)},sec=0,flt=0;
const save=()=>{try{localStorage.setItem("eko4pat",JSON.stringify(st))}catch(e){}};
try{let s=JSON.parse(localStorage.getItem("eko4pat")||"null");if(s&&s.a&&s.a.length==40)st=s}catch(e){}
const nA=()=>st.a.filter(x=>x>=0).length;
function card(i,rev){let q=Q[i],h=`<div class="card" id="q${i}"><b>Soalan ${i+1}</b>`;
if(q.n)h+=`<p class="mut">${E(q.n)}</p>`;if(q.s)h+=`<p>${E(q.s)}</p>`;if(q.b)h+=`<div class="box">${q.b}</div>`;
let F=q.f?`<figure><img src="${IM[q.f]}" alt="${E(q.c||"Rajah soalan "+(i+1))}">${q.c?`<figcaption>${E(q.c)}</figcaption>`:""}</figure>`:"";if(!q.fl)h+=F;
if(q.t)h+=`<div class="tw">${q.t}</div>${q.tc?`<div class="cap">${E(q.tc)}</div>`:""}`;
if(q.s2)h+=`<p>${E(q.s2)}</p>`;if(q.fl)h+=F;
if(q.r)h+=`<div class="rom">`+q.r.map(r=>`<div><b>${r[0]}</b><span>${E(r[1])}</span></div>`).join("")+`</div>`;
h+=`<div class="${q.lt?"lt":""}">`+q.o.map((o,j)=>{let t=q.lt?"":" "+E(o);
if(rev){let c=j==K[i]?"ok":st.a[i]==j?"no":"";return`<div class="opt ${c}"><b>${L[j]}</b><span>${t}${j==K[i]?" ✓":st.a[i]==j?" ✗ (jawapan anda)":""}</span></div>`}
return`<label class="opt"><input type="radio" name="a${i}" data-i="${i}" data-j="${j}" ${st.a[i]==j?"checked":""}><b>${L[j]}</b><span>${t}</span></label>`}).join("")+`</div></div>`;return h}
function grid(){$("#grid").innerHTML=st.a.map((x,i)=>`<button data-g="${i}" class="${x>=0?"d":""}" aria-label="Soalan ${i+1}">${i+1}</button>`).join("");let n=nA();$("#prog").textContent=n+" / 40 dijawab";$("#pb").style.width=n/40*100+"%"}
function render(){document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("on",i==sec));let h="";for(let i=sec*10;i<sec*10+10;i++)h+=card(i,0);$("#body").innerHTML=h;grid()}
document.addEventListener("change",e=>{let t=e.target;if(t.dataset.i!=null){st.a[t.dataset.i]=+t.dataset.j;save();grid()}});
document.addEventListener("click",e=>{let g=e.target.dataset.g;if(g!=null){sec=Math.floor(g/10);render();$("#q"+g).scrollIntoView()}});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{sec=+b.dataset.s;render();scrollTo(0,0)});
$("#go").onclick=()=>{let n=$("#nm").value.trim(),k=$("#kl").value.trim();if(!n){alert("Sila masukkan nama murid.");$("#nm").focus();return}if(!k){alert("Sila masukkan kelas.");$("#kl").focus();return}st.n=n;st.k=k;save();begin()};
function begin(){$("#start").classList.add("hid");$("#quiz").classList.remove("hid");$("#who").textContent="Murid: "+st.n+" ("+st.k+")";render()}
function review(){let h="";st.a.forEach((x,i)=>{if(!flt||x!=K[i])h+=card(i,1)});$("#rev").innerHTML=h||'<div class="card ok">Tiada soalan salah. Tahniah!</div>'}
$("#sub").onclick=()=>{let u=40-nA();if(u&&!confirm("Masih ada "+u+" soalan belum dijawab. Hantar juga?"))return;
let s=st.a.reduce((n,x,i)=>n+(x==K[i]?1:0),0);$("#quiz").classList.add("hid");$("#res").classList.remove("hid");
$("#who2").textContent="Nama murid: "+st.n+" · Kelas: "+st.k;$("#tot").textContent=s+" / 40 markah ("+Math.round(s/.4)+"%)";
$("#brk").textContent="Betul: "+s+" · Salah: "+(nA()-s)+" · Tidak dijawab: "+u;flt=0;review();scrollTo(0,0)};
$("#f1").onclick=()=>{flt=0;review()};$("#f2").onclick=()=>{flt=1;review()};
$("#again").onclick=()=>{if(!confirm("Padam jawapan dan mula semula?"))return;st={n:st.n,k:st.k,a:Array(40).fill(-1)};save();$("#res").classList.add("hid");sec=0;begin()};
if(st.n)$("#nm").value=st.n;if(st.k)$("#kl").value=st.k;
</script></body></html>
